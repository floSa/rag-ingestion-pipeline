services:
  # Base Vectorielle (interne uniquement)
  chromadb:
    image: chromadb/chroma:0.6.3
    restart: unless-stopped
    expose:
      - "8000"
    volumes:
      - ./Datas/database/chromadb:/chroma/chroma
    networks:
      - rag_network

  # Base Graphe - Nebula (interne uniquement)
  metad:
    image: vesoft/nebula-metad:v3.6.0
    restart: unless-stopped
    container_name: metad
    command:
      - --data_path=/data/meta
      - --port=9559
      - --ws_http_port=19559
      - --local_ip=metad
      - --meta_server_addrs=metad:9559
    volumes:
      - ./Datas/database/nebula/meta:/data/meta
    networks:
      - rag_network

  storaged:
    image: vesoft/nebula-storaged:v3.6.0
    restart: unless-stopped
    container_name: storaged
    command:
      - --data_path=/data/storage
      - --port=9779
      - --ws_http_port=19779
      - --local_ip=storaged
      - --meta_server_addrs=metad:9559
    volumes:
      - ./Datas/database/nebula/storage:/data/storage
    depends_on:
      - metad
    networks:
      - rag_network

  graphd:
    image: vesoft/nebula-graphd:v3.6.0
    restart: unless-stopped
    container_name: graphd
    expose:
      - "9669"
    command:
      - --port=9669
      - --ws_http_port=19669
      - --local_ip=graphd
      - --meta_server_addrs=metad:9559
    depends_on:
      - storaged
    networks:
      - rag_network

  # Studio UI (exposé pour visualisation du graphe)
  nebula-studio:
    image: vesoft/nebula-graph-studio:v3.8.0
    restart: unless-stopped
    ports:
      - "7001:7001"
    networks:
      - rag_network

  # Object Storage — SeaweedFS (interne uniquement)
  #
  # LE SEUL STOCKAGE OBJET DE LA PILE depuis le 25 septembre 2026. Il en a
  # cohabite un autre pendant la bascule, le temps que le retour arriere soit
  # ecarte ; ce n'est plus le cas, et son service, son volume et ses variables
  # ont quitte ce fichier. Le retour arriere ne passe plus par un serveur garde
  # debout : le CORPUS regenere tout, par purge et reingestion.
  #
  # Le pipeline et l'agent parlent S3 par un client generique : rien ne nomme
  # le serveur dans le code, seul `S3_ENDPOINT` le designe.
  #
  # AUCUN SECRET DANS LE DEPOT. SeaweedFS veut un fichier d'identites
  # (`-s3.config`), donc un fichier qui porte des cles. Il est ECRIT AU
  # DEMARRAGE dans un tmpfs du conteneur, a partir de variables du `.env` non
  # versionne : rien n'est monte depuis le depot, et rien n'y est ecrit.
  # Le rendu passe par un heredoc et non par des arguments : une cle passee en
  # argument se lit dans `docker inspect` et dans la table des processus.
  #
  # DEUX JEUX D'IDENTIFIANTS AUX DROITS DISTINCTS, ce que le stockage precedent
  # ne donnait pas ici : le pipeline ecrit (`Admin` est necessaire a
  # `make_bucket`), l'agent ne fait que lire et lister. SeaweedFS n'a pas de
  # console proprietaire pour les declarer : ce fichier EST la declaration.
  seaweedfs:
    image: chrislusf/seaweedfs:3.80
    restart: unless-stopped
    hostname: seaweedfs
    expose:
      - "8333"
    env_file: .env
    environment:
      SEAWEEDFS_RW_ACCESS_KEY: ${SEAWEEDFS_RW_ACCESS_KEY}
      SEAWEEDFS_RW_SECRET_KEY: ${SEAWEEDFS_RW_SECRET_KEY}
      SEAWEEDFS_RO_ACCESS_KEY: ${SEAWEEDFS_RO_ACCESS_KEY}
      SEAWEEDFS_RO_SECRET_KEY: ${SEAWEEDFS_RO_SECRET_KEY}
    tmpfs:
      - /run/seaweedfs:mode=0700
    volumes:
      - ./Datas/database/seaweedfs:/data
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        umask 077
        cat > /run/seaweedfs/s3.json <<EOF
        {
          "identities": [
            {
              "name": "pipeline",
              "credentials": [
                {
                  "accessKey": "$${SEAWEEDFS_RW_ACCESS_KEY}",
                  "secretKey": "$${SEAWEEDFS_RW_SECRET_KEY}"
                }
              ],
              "actions": ["Admin", "Read", "Write", "List", "Tagging"]
            },
            {
              "name": "agent",
              "credentials": [
                {
                  "accessKey": "$${SEAWEEDFS_RO_ACCESS_KEY}",
                  "secretKey": "$${SEAWEEDFS_RO_SECRET_KEY}"
                }
              ],
              "actions": ["Read", "List"]
            }
          ]
        }
        EOF
        exec weed server \
          -dir=/data \
          -ip=seaweedfs \
          -master.volumeSizeLimitMB=1024 \
          -volume.max=0 \
          -filer \
          -s3 \
          -s3.port=8333 \
          -s3.config=/run/seaweedfs/s3.json
    # `seaweedfs:8333` et non `localhost:8333` : `-ip=seaweedfs` fait ECOUTER le
    # serveur sur cette adresse-la et sur elle seule, si bien qu'une sonde sur
    # la boucle locale recoit « connection refused » sur un service parfaitement
    # sain. Et `/healthz` et non `/` : la racine S3 non authentifiee rend un
    # **403**, ce qui est le bon comportement et ce qui rendrait la sonde
    # eternellement rouge. `mesure` : `/healthz` rend 200, `/` rend 403.
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://seaweedfs:8333/healthz
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    networks:
      - rag_network

  # Orchestrateur ETL - Dagster
  postgres-dagster:
    image: postgres:15-alpine
    restart: unless-stopped
    expose:
      - "5432"
    env_file: .env
    environment:
      POSTGRES_USER: ${DAGSTER_POSTGRES_USER}
      POSTGRES_PASSWORD: ${DAGSTER_POSTGRES_PASSWORD}
      POSTGRES_DB: ${DAGSTER_POSTGRES_DB}
    volumes:
      - ./Datas/database/postgres:/var/lib/postgresql/data
    networks:
      - rag_network

  dagster-webserver:
    build:
      context: .
      dockerfile: Dockerfile.dagster
    restart: unless-stopped
    ports:
      - "3002:3000"
    env_file: .env
    environment:
      DAGSTER_POSTGRES_USER: ${DAGSTER_POSTGRES_USER}
      DAGSTER_POSTGRES_PASSWORD: ${DAGSTER_POSTGRES_PASSWORD}
      DAGSTER_POSTGRES_DB: ${DAGSTER_POSTGRES_DB}
      DAGSTER_POSTGRES_HOST: ${DAGSTER_POSTGRES_HOST}
      DAGSTER_TELEMETRY_DISABLED: 1
      HOME: /tmp
      # DAGSTER TELEVERSE LUI-MEME LES IMAGES HTML (`src/pipeline/media.py`) :
      # il lui faut donc les memes identifiants que `docling-service`, derives
      # du meme jeu RW (voir le commentaire de ce service). `env_file: .env`
      # ne les porte pas — le `.env` ne declare que `SEAWEEDFS_RW_*` — et sans
      # ces lignes le client partait aux identifiants VIDES : 403 a chaque
      # televersement, images absentes, aucune erreur au demarrage (§4.28.b).
      # Les reglages refusent desormais un identifiant vide au demarrage.
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY: ${SEAWEEDFS_RW_ACCESS_KEY}
      S3_SECRET_KEY: ${SEAWEEDFS_RW_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
    volumes:
      - ./src:/opt/dagster/app/src
      - ./Datas:/opt/dagster/app/Datas
      - ./dagster.yaml:/opt/dagster/dagster_home/dagster.yaml
    command: ["dagster-webserver", "-h", "0.0.0.0", "-p", "3000", "-w", "/opt/dagster/app/src/workspace.yaml"]
    depends_on:
      - postgres-dagster
    networks:
      - rag_network

  dagster-daemon:
    build:
      context: .
      dockerfile: Dockerfile.dagster
    restart: unless-stopped
    env_file: .env
    environment:
      DAGSTER_POSTGRES_USER: ${DAGSTER_POSTGRES_USER}
      DAGSTER_POSTGRES_PASSWORD: ${DAGSTER_POSTGRES_PASSWORD}
      DAGSTER_POSTGRES_DB: ${DAGSTER_POSTGRES_DB}
      DAGSTER_POSTGRES_HOST: ${DAGSTER_POSTGRES_HOST}
      DAGSTER_TELEMETRY_DISABLED: 1
      HOME: /tmp
      # Memes identifiants que `dagster-webserver`, pour la meme raison : les
      # runs lances par le demon televersent les images HTML.
      S3_ENDPOINT: ${S3_ENDPOINT}
      S3_ACCESS_KEY: ${SEAWEEDFS_RW_ACCESS_KEY}
      S3_SECRET_KEY: ${SEAWEEDFS_RW_SECRET_KEY}
      S3_BUCKET: ${S3_BUCKET}
    volumes:
      - ./src:/opt/dagster/app/src
      - ./Datas:/opt/dagster/app/Datas
      - ./dagster.yaml:/opt/dagster/dagster_home/dagster.yaml
    command: ["dagster-daemon", "run", "-w", "/opt/dagster/app/src/workspace.yaml"]
    depends_on:
      - postgres-dagster
    networks:
      - rag_network

  # Microservice d'extraction (interne uniquement)
  docling-service:
    build:
      context: .
      dockerfile: Dockerfile.docling
    container_name: rag_assistant-docling-service-1
    restart: always
    expose:
      - "8000"
    volumes:
      - ./Datas:/opt/dagster/app/Datas
      - ./src:/app/src
      # Cache des modeles (Docling + embeddings). Sans volume, HOME=/tmp les
      # place dans la couche ephemere du conteneur : chaque recreation
      # re-telecharge plusieurs centaines de Mo avant le premier document.
      - docling_models:/tmp/.cache
    env_file: .env
    environment:
      # LES IDENTIFIANTS SONT DERIVES DU JEU RW, PAS RECOPIES DANS LE `.env`.
      # `SEAWEEDFS_RW_*` declare les identites du SERVEUR, quelques lignes plus
      # haut dans ce meme fichier ; `S3_ACCESS_KEY` / `S3_SECRET_KEY` sont ce
      # que le CLIENT presente. Ecrire deux fois la meme cle dans le `.env`
      # ferait deux valeurs a tenir d'accord, et le jour ou elles divergeraient
      # le serveur rendrait 403 sur une pile dont la configuration aurait l'air
      # juste. Une seule valeur, deux noms, un seul endroit qui la porte.
      #
      # Le jeu RW, et non RO : le pipeline ECRIT (`make_bucket` exige `Admin`).
      # Le jeu RO est celui de `rag-agent-chat`, qui n'est pas de cette pile.
      - S3_ENDPOINT=${S3_ENDPOINT}
      - S3_ACCESS_KEY=${SEAWEEDFS_RW_ACCESS_KEY}
      - S3_SECRET_KEY=${SEAWEEDFS_RW_SECRET_KEY}
      - S3_BUCKET=${S3_BUCKET}
      - NEBULA_HOST=${NEBULA_HOST}
      - NEBULA_PORT=${NEBULA_PORT}
      - CHROMA_HOST=${CHROMA_HOST}
      - CHROMA_PORT=${CHROMA_PORT}
      - HOME=/tmp
    # Le service n'est « healthy » qu'une fois les modeles charges, le schema
    # NebulaGraph initialise et le bucket pret. start_period genereux :
    # le premier demarrage telecharge les modeles Docling et l'embedding.
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=10)
      interval: 30s
      timeout: 15s
      retries: 5
      start_period: 600s
    shm_size: 2gb
    deploy:
      resources:
        limits:
          memory: 10G
    # Pas de reservation GPU ici. Elle etait ecrite en dur et rendait le service
    # INCREABLE sur une machine sans runtime nvidia : « could not select device
    # driver "nvidia" ». Or l'ingestion tourne sur processeur, et c'est le cas
    # nominal de cette chaine. Pour rendre un GPU au service, superposer
    # docker-compose.gpu.yml :
    #   docker compose -f docker-compose.yml -f docker-compose.gpu.yml up -d
    networks:
      - rag_network

volumes:
  # Cache des modeles du service d'extraction, conserve entre les recreations.
  docling_models:

networks:
  rag_network:
    # Nom stable (sans préfixe de projet) : rag-agent-chat le référence en externe
    name: rag_network
    driver: bridge
