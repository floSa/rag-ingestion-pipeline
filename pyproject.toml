[project]
name = "rag-assistant"
version = "0.1.0"
description = "Pipeline d'ingestion RAG : extraction, knowledge graph, vectorisation"
requires-python = ">=3.12"
# Dépendances de l'orchestration Dagster + nettoyage HTML — source de vérité pour
# uv (`uv sync`). Les deps lourdes d'extraction (docling, torch, sentence-transformers,
# PyMuPDF…) vivent dans Dockerfile.docling. requirements.txt conservé pour Docker.
dependencies = [
    "dagster==1.13.16",
    "dagster-webserver==1.13.16",
    "dagster-postgres==0.29.16",
    "dagster-docker==0.29.16",
    "beautifulsoup4==4.15.0",
    "lxml==6.1.1",
    "trafilatura==2.2.0",
    "readability-lxml==0.8.4.1",
    "PyYAML==6.0.3",
    "requests==2.34.2",
    "pydantic-settings==2.14.2",
    "minio==7.2.20",
]

# Outils de la porte qualite (`make all`, `make audit`, les hooks pre-commit).
# Ils vivent ici, et non dans un requirements-dev.txt separe, pour une raison
# precise : une liste non referencee par la source de verite ne s'installe pas,
# donc la porte ne tourne pas, donc un chiffre de tests circule sans qu'aucune
# commande ne l'ait produit. C'est exactement ce qui est arrive.
# `uv sync` installe ce groupe par defaut, et le Makefile appelle chaque outil
# derriere `uv run` : la sequence complete tient en `make install && make all`,
# sans activation d'environnement ni etape a se rappeler.
#
# Les versions sont epinglees comme celles de production. Un `ruff` non epingle
# rend un verdict qui change avec la date : la porte cesse d'etre reproductible
# au sens ou l'entend ce depot. `ruff` est epingle a la version du hook
# `.pre-commit-config.yaml` : deux formateurs de versions differentes se
# defont mutuellement le travail a chaque commit.
[dependency-groups]
dev = [
    "pytest==9.1.1",
    "pytest-cov==7.1.0",
    "ruff==0.11.8",
    "mypy==2.3.1",
    "types-requests==2.33.0.20260712",
    "types-PyYAML==6.0.12.20260815",
    "pip-audit==2.10.1",
    "pre-commit==4.6.2",
]

[tool.ruff]
target-version = "py312"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "N",    # pep8-naming
    "ANN",  # flake8-annotations
]
ignore = [
    "ANN401",  # dynamically typed expressions (typing.Any)
]

[tool.ruff.lint.per-file-ignores]
# E741 : les mocks bbox repliquent les attributs Docling (l, t, r, b)
"tests/**/*.py" = ["ANN", "E741"]

[tool.ruff.lint.isort]
known-first-party = ["src"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["tests/"]
# Dagster/FastAPI decorators are untyped, disable these checks for now
disallow_untyped_decorators = false

[[tool.mypy.overrides]]
module = [
    "dagster.*",
    "docling.*",
    "docling_core.*",
    "fitz",
    "minio.*",
    "nebula3.*",
    "chromadb.*",
    "sentence_transformers.*",
    "bs4",
    "fastapi.*",
    "uvicorn",
    "requests.*",
    "trafilatura.*",
    "readability.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: tests requiring heavy infrastructure (NebulaGraph, GPU)",
    "integration: tests requiring Docker services",
]
addopts = "-q --tb=short"
