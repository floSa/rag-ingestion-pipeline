# Jeu de questions de la premiere campagne de reference — 2 septembre 2026
#
# La specification vit au registre, `documentation/axes_amelioration.md`
# section 1 « La conception du jeu d'evaluation » : cinq strates, 12 / 8 / 4 / 4
# / 2, trente questions. Les questions pieges sont reportees au second tour.
#
# CE FICHIER EST EN YAML ET NON EN JSON, ET C'EST POUR UNE RAISON MESUREE —
# MAIS PAS CELLE QUI ETAIT ECRITE ICI. Ce bloc disait que le JSON etait refuse
# parce qu'il n'admet pas de commentaire, donc pas de `pragma: allowlist secret`
# pour declarer les faux positifs au site. L'arbitrage tient ; le mecanisme
# n'etait pas celui-la.
#
# Mesure du 3 septembre 2026, `detect-secrets-hook` v1.5.0, MEME CONTENU rendu
# dans les deux formats :
#     le contenu en JSON              -> rc=1, 11 detections
#                                        (1 empreinte + 10 `element_id`)
#     ce fichier YAML                 -> rc=0
#     ce fichier PRIVE de son pragma  -> rc=1, UNE detection : l'empreinte seule
#
# La troisieme ligne tranche : LES DIX `element_id` NE SONT JAMAIS DETECTES EN
# YAML. La cause est une propriete du transformateur YAML de `detect-secrets` —
# il rend les VALEURS DE MAPPING et pas les ELEMENTS DE SEQUENCE. Verifie sur un
# fichier d'essai de trois chaines hexadecimales, deux en elements de liste et
# une en valeur de mapping : YAML 1 detection, le meme contenu en JSON 3. Or les
# `element_id` d'ici vivent en elements de sequence, et l'empreinte en valeur de
# mapping.
#
# IL N'Y A DONC QU'UN SEUL PRAGMA DANS CE FICHIER, sur l'empreinte, et ce bloc
# parlait des « pragmas » au pluriel comme s'ils couvraient les `element_id` :
# DIX DES ONZE FAUX POSITIFS NE SONT DECLARES NULLE PART, parce que rien ne le
# demande. Le YAML reste le bon format — le pragma de l'empreinte y est possible
# et visible dans le diff, et le hook `check-yaml` valide ce fichier a chaque
# commit, ce que le JSON n'avait pas.
#
# ET AUCUNE DES ONZE VALEURS NE MASQUE UN SECRET. Ce sont des `element_id` du
# contrat — dix hexadecimaux derives du contenu d'un passage public (exigence 2)
# — et l'empreinte SHA-256 de la liste des fichiers du corpus versionne. Rien de
# tout cela n'est confidentiel : les `element_id` sont precisement ce que le jeu
# de questions doit designer pour que le rappel soit calculable.
#
# CE QUI GARDE CE FICHIER, et aucun des deux ne remplace l'autre :
#   - `tests/unit/test_jeu_de_questions.py`  la FORME, contre la specification ;
#   - `scripts/campagne/verifier-le-jeu-de-questions.py`  la PROVENANCE, contre
#     l'index vivant. Il sort en 1 au premier desaccord.
campagne: premiere-campagne-de-reference
date: '2026-09-02'
specification: documentation/axes_amelioration.md, section 1 (La conception du jeu d'evaluation)
reserve: CONTROLE DE BON FONCTIONNEMENT, PAS DECISION D'ARCHITECTURE. 30 questions suffisent a prouver
  que la chaine marche de bout en bout et a voir un defaut grossier ; elles ne suffisent pas a arbitrer
  un reglage. Un ecart de deux points est du bruit.
index:
  chunks: 4367
  documents: 23
  sommets: 15196
  aretes_parent_of: 15173
  modele_embedding: paraphrase-multilingual-MiniLM-L12-v2
  # L'empreinte SHA-256 de la LISTE des fichiers du corpus versionne, pas
  # d'un secret : elle atteste que le corpus lu par cette campagne est celui
  # du depot, a l'octet. `detect-secrets` la lit comme une chaine hexadecimale
  # a forte entropie, ce qu'elle est ; declaree ici parce qu'un pragma meurt
  # avec la ligne qu'il annote, la ou une baseline lui survivrait (registre,
  # « La baseline detect-secrets — supprimee, et pourquoi »).
  corpus_sha256_de_la_liste: b66441820e9b8d3114d5dafa0d5c6d461c427b3e770fb2c0e584e947df5f508e  # pragma: allowlist secret
echantillonnage:
  principe: 'On echantillonne les QUESTIONS, jamais le corpus. Les 23 documents sont ingeres et les questions
    sont cherchees contre les 4367 chunks : grosse meule de foin, echantillon d''aiguilles.'
