questions:
- id: q01
  strate: multi_passages
  langue: en
  question: Why is endpoint-level traffic splitting the wrong mechanism for an experiment whose unit is
    the booking, and where must the assignment decision move instead?
  element_ids:
  - 3dd0709c4a
  - 3af1392862
  - 6b52bccda7
  reponse_attendue: A traffic split decides model selection independently per request, so the same entity
    can be routed to different versions; the rule is to randomise at the level of analysis, so the assignment
    must move out of the endpoint configuration and into the model logic.
- id: q02
  strate: multi_passages
  langue: en
  question: What rule governs the choice of randomization unit, and when is customer-level assignment
    preferable to request-level assignment?
  element_ids:
  - 6b52bccda7
  - cb77da6c17
  - d44caef114
  reponse_attendue: Randomise at the same level at which the experiment is analysed. Customer-level suits
    customer-level outcomes (conversion, retention, revenue); request-level is appropriate only when requests
    are genuinely independent, e.g. backend evaluations invisible to the customer.
- id: q03
  strate: multi_passages
  langue: en
  question: Which three serving scenarios does the model serving chapter cover, and which one is right
    when predictions are precomputed?
  element_ids:
  - e74bcf1706
  - eda4f1e10c
  reponse_attendue: Model Serving, serving precomputed batch predictions (Feature Serving), and Model
    Serving with feature lookup. Feature Serving is the one for precomputed predictions retrieved at request
    time.
- id: q04
  strate: multi_passages
  langue: en
  question: 'Route optimization on a serving endpoint rules out one authentication method: which one,
    and what does the book recommend using instead and why?'
  element_ids:
  - d5948cc70d
  - 05f988efec
  reponse_attendue: Route optimization supports only OAuth, so a personal access token cannot be used.
    The recommended alternative is an OAuth token tied to a service principal, which has no permissions
    by default and can be granted access to a single endpoint.
- id: q05
  strate: multi_passages
  langue: en
  question: What bounds the chunk size you may choose, and why does counting characters not tell you whether
    a chunk fits?
  element_ids:
  - 4b1d79b83a
  - 23d10ed8de
  - ce368ff12a
  reponse_attendue: Chunk size is bounded by the embedding window of the chosen model; the limits are
    measured in tokens, not characters, and the two are not interchangeable, so a character-based chunk
    size can still overflow the window and part of the content is never indexed.
- id: q06
  strate: multi_passages
  langue: en
  question: As a corpus grows, why does a retrieval pipeline built on plain vector search degrade, and
    which two mechanisms are recommended to recover quality?
  element_ids:
  - 2971064aea
  - 948ec002eb
  - d913ef3b4f
  reponse_attendue: More documents mean more plausible matches for any query, so accurate retrieval needs
    more filtering and ranking. The two recommended mechanisms are hybrid search (catching semantic and
    keyword matches) and reranking of the retrieved documents.
- id: q07
  strate: multi_passages
  langue: en
  question: Which nearest-neighbour algorithm and distance metric does Databricks AI Search use, and what
    operational limit is placed on its built-in reranker?
  element_ids:
  - 5558e561d7
  - 269b2e32d8
  reponse_attendue: HNSW for approximate nearest neighbour search with the L2 distance metric. The built-in
    reranker is not suitable above about 5 QPS or under low-latency requirements, where a custom reranker
    on a Model Serving endpoint is advised.
- id: q08
  strate: multi_passages
  langue: en
  question: What are the two MLflow evaluation modes, and which one suits promotion decisions made from
    curated production traces?
  element_ids:
  - eacfb832a2
  - ea7d4cf6c0
  - 94f9c56cd0
  reponse_attendue: Direct evaluation, where MLflow calls the application itself, and answer-sheet evaluation,
    where precomputed outputs or existing traces are scored without invoking the application. Answer-sheet
    evaluation is the one suited to regression testing, benchmarking and promotion decisions from curated
    production traces.
- id: q09
  strate: multi_passages
  langue: en
  question: When should a code-based scorer be preferred to an LLM judge, and what properties make a scorer
    a good one?
  element_ids:
  - 5bdad90f29
  - e67803db3e
  - 0d39dea701
  reponse_attendue: 'Code-based scorers suit deterministic checks: they run locally, cost no tokens and
    are reproducible, which fits continuous evaluation and regression tests. An LLM judge becomes appropriate
    when the assessment needs meaning, intent or subtlety rather than surface patterns. A good scorer
    is predictable, explainable and tied to outcomes that matter.'
- id: q10
  strate: multi_passages
  langue: en
  question: How large does an evaluation dataset need to be before it tells you something, and what should
    it keep containing over time?
  element_ids:
  - e8ba504198
  - 890c168677
  reponse_attendue: 'Even a small synthetic dataset of around 50 queries is enough to tell whether hybrid
    search or reranking improves quality. The dataset is not built once: as production traces and failures
    accumulate it should evolve, staying representative enough to catch regressions yet small enough to
    inspect and maintain.'
- id: q11
  strate: multi_passages
  langue: en
  question: What are guardrails for, at which two points can the gateway's built-in ones act, and what
    does a custom guardrail add?
  element_ids:
  - ca2897cadb
  - 0f4741eda9
  - be9026f5ba
  reponse_attendue: Guardrails are rules around an LLM that restrict accepted inputs and outputs so the
    application stays within expectations when users ask unexpected questions. The gateway's built-in
    guardrails can inspect the inbound request before it reaches the model, or the outbound response before
    it returns to the user. Custom guardrails let a team define its own validation or filtering logic
    at the gateway layer for its domain or compliance needs.
- id: q12
  strate: multi_passages
  langue: en
  question: What distinguishes a champion from a challenger agent, and how does blue-green deployment
    introduce the challenger without risking the production traffic?
  element_ids:
  - 2b3d899ecd
  - f60d2898bb
  reponse_attendue: The champion is the version currently serving users; the challenger is a new candidate
    with improved prompts, model, retrieval or tools. In blue-green deployment the champion (blue) keeps
    serving all traffic while the challenger (green) is deployed separately; once validated, traffic switches
    to green, and it can be redirected back to blue if problems appear.
- id: q13
  strate: simple
  langue: en
  question: How much memory does a CPU model serving endpoint allocate per worker by default?
  element_ids:
  - e1ab19bc3b
  reponse_attendue: 4 GB per worker by default; the CPU_MEDIUM and CPU_LARGE workload types trade concurrency
    for more memory on the same CPU hardware.
- id: q14
  strate: simple
  langue: en
  question: What capacity options can be chosen for a Databricks Online Feature Store, and how much RAM
    does one capacity unit represent?
  element_ids:
  - 479129f25b
  reponse_attendue: CU_1, CU_2, CU_4 or CU_8, where each capacity unit is about 2 GB of RAM.
