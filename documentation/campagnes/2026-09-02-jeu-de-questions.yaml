  question: Pourquoi une recette de cuisine sert-elle a expliquer qu'un agent devrait pouvoir changer
    d'infrastructure sans etre reecrit ?
  element_ids:
  - 3b6fb4e59a
  - fbf9cbd029
  reponse_attendue: 'Une recette est portable : on peut la cuisiner dans n''importe quel four, dans n''importe
    quelle cuisine, parce que ce qu''il faut faire est separe de l''endroit ou on le fait. Les cadres
    d''agents actuels ne separent pas les deux : definir un agent y revient a choisir aussi le four et
    le garde-manger, ce qui produit un enfermement chez un fournisseur et impose de tout reconstruire
    pour changer de cadre.'
  motif_de_la_reformulation: 'Question FRANCAISE sur un document ANGLAIS : c''est la moitie survivante
    de la mesure translinguistique, le corpus etant entierement anglais. Aucun mot de la question n''apparait
    dans le passage.'
