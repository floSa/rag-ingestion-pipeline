  langue: en
  question: What is meant by a 'spectrum of factuality' when detecting hallucinations in a RAG answer?
  element_ids:
  - 0f66b973ed
  reponse_attendue: Generated text may be partially supported by the retrieved data rather than plainly
    true or false, so factuality is a spectrum instead of a binary, which makes hallucinations harder
    to detect.
